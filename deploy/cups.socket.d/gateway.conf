# Drop-in for cups.socket. Only the gateway (group spoolsteward) and root may talk to CUPS;
# other local users cannot bypass the gateway with lp/lpstat or raw IPP.
# Local users print through the gateway too: ipps://localhost/printers/<name>
[Socket]
ListenStream=
ListenStream=/run/cups/cups.sock
SocketMode=0660
SocketUser=root
SocketGroup=spoolsteward
